<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div id="app" class="glass-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Math Master</h1>
            <p>Select your grade level to start learning!</p>
            <div class="grade-grid">
                <button class="grade-btn" data-grade="0">Kindergarten</button>
                <button class="grade-btn" data-grade="1">Grade 1</button>
                <button class="grade-btn" data-grade="2">Grade 2</button>
                <button class="grade-btn" data-grade="3">Grade 3</button>
                <button class="grade-btn" data-grade="4">Grade 4</button>
                <button class="grade-btn" data-grade="5">Grade 5</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="header">
                <div class="score-board">Score: <span id="score">0</span></div>
                <div class="streak-board">🔥 Streak: <span id="streak">0</span></div>
                <div class="timer-board">⏱ <span id="time-left">60</span>s</div>
                <div class="question-tracker" style="display: none;">Q: <span id="current-question-num">1</span></div>
            </div>
            
            <div class="question-container">
                <h2 id="question">What is 5 + 3?</h2>
            </div>

            <div class="answers-grid" id="answers-grid">
                <button class="answer-btn">8</button>
                <button class="answer-btn">7</button>
                <button class="answer-btn">10</button>
                <button class="answer-btn">1</button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <h1>Great Job!</h1>
            <p>Your final score is:</p>
            <div class="final-score" id="final-score">8/10</div>
            <div class="percentile" id="percentile" style="font-size: 2rem; color: var(--primary); margin-bottom: 20px; font-weight: 600;">80% Correct</div>
            <p id="feedback-message">Keep practicing!</p>
            <button id="restart-btn" class="primary-btn">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
